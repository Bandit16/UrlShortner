{% extends "app/base.html" %}
{% load static %}
{% block content %}

<div class="form-card">
    <h2><i class="fas fa-plus-circle" style="color:var(--accent);margin-right:.5rem;"></i>Create Short Link</h2>
    <p class="form-help">Paste a long URL, optionally pick a short code, and set an expiry if needed.</p>
    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="margin-top:.5rem;">
            <i class="fas fa-link"></i> Shorten
        </button>
    </form>
</div>

<script src="{% static 'app/js/forms.js' %}"></script>

{% endblock content %}
