{% extends "app/base.html" %}
{% load static %}
{% block content %}

<div class="form-card">
    <h2><i class="fas fa-edit" style="color:var(--accent);margin-right:.5rem;"></i>Edit Link</h2>
    <p class="form-help">Update the destination, expiry, or custom code for this short link.</p>
    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="margin-top:.5rem;">
            <i class="fas fa-save"></i> Save Changes
        </button>
    </form>
</div>

<script src="{% static 'app/js/forms.js' %}"></script>

{% endblock content %}
